name: boraver
description: "BoraVer - organize e sorteie os filmes que você quer assistir."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Textos do Material (calendário, botões) em português.
  flutter_localizations:
    sdk: flutter

  # Estado da interface (ChangeNotifier + Provider).
  provider: ^6.1.5+1
  # Banco local chave-valor: arquivos no Android, IndexedDB na Web.
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  # Chamadas à API do TMDB (opcional).
  http: ^1.6.0
  # Exportar/importar backup em JSON (Android e Web).
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-DMSerifDisplay.txt

  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
